name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  type-check:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Mypy
        run: mypy src/

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=augsynth_py --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  unit-tests-min-deps:
    # Guards the compatibility promise in pyproject.toml: augsynth-py must stay
    # installable next to libraries that are still pinned to the numpy 1.x ABI.
    # This job resolves nothing — it installs the exact floors declared in
    # [project.dependencies] and runs the suite against them.
    name: Unit tests (oldest supported dependencies, numpy 1.x)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the declared dependency floors
        # Keep these pins in sync with the floors in pyproject.toml.
        run: |
          pip install \
            "numpy==1.26.0" \
            "scipy==1.12.0" \
            "cvxpy==1.4.1" \
            "polars==1.0.0" \
            "joblib==1.3.0" \
            "pandas==2.0.3" \
            "pytest==8.0.0"

      - name: Install augsynth-py without disturbing the pinned floors
        run: pip install -e . --no-deps

      - name: Show resolved versions
        run: pip list

      - name: Run unit tests
        run: pytest tests/unit/ -q
