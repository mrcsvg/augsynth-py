name: Validation against R

# Parity tests are slow (R install + package install + cross-language calls).
# We run them on PR to main and on push to main, but not on every commit to
# feature branches. Enable manually via workflow_dispatch when iterating.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Numerical parity vs R augsynth
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # R >= 4.5: modern rpy2 (unpinned rpy2>=3.5) binds the R_getVar symbol,
          # which was introduced in R 4.5.0. On R 4.4 rpy2 imports fail at load
          # with "undefined symbol: R_getVar". Validated locally on R 4.5.3.
          r-version: "4.5"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('.github/workflows/validation.yml') }}

      - name: Install R dependencies
        # remotes::install_github reads GITHUB_PAT to authenticate against the
        # GitHub API. Without it the runner uses an anonymous (or exhausted
        # bundled) token and hits the 60 req/hr rate limit, failing with
        # "cannot open URL 'https://api.github.com/repos/.../DESCRIPTION'".
        # GITHUB_TOKEN is injected automatically and lifts the limit to 1000/hr.
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e 'install.packages(c("remotes", "Synth"), repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_github("ebenmichael/augsynth", upgrade = "never")'
          Rscript -e 'remotes::install_github("facebookincubator/GeoLift", upgrade = "never")'

      - name: Install Python package with validation extras
        run: |
          pip install -e ".[validation,dev]"

      - name: Run parity tests
        run: pytest tests/validation_against_r/ -v
