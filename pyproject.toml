[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "augsynth-py"
description = "Augmented Synthetic Control Methods and geo-experimentation tooling for Python."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "augsynth-py contributors" },
]
keywords = [
    "causal-inference",
    "synthetic-control",
    "geo-experiments",
    "marketing-science",
    "econometrics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dynamic = ["version"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "cvxpy>=1.5",
    "polars>=1.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
validation = [
    # Required to run tests/validation_against_r/.
    # Also requires R (>=4.5) and the augsynth R package installed on the system.
    "rpy2>=3.5",
    # conftest.py bridges the R GeoLift_PreTest data.frame to polars via rpy2's
    # pandas2ri converter (R -> pandas -> polars), so pandas must be importable
    # for the validation suite. pyarrow backs pl.from_pandas for the non-numpy
    # (string 'location') column — without it the bridge raises ImportError.
    # Both are test-only; the library itself uses polars exclusively (no pandas
    # in src/). Verified end-to-end on the exact conftest conversion path.
    "pandas>=2.0",
    "pyarrow>=14.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Repository = "https://github.com/mrcsvg/augsynth-py"
Issues = "https://github.com/mrcsvg/augsynth-py/issues"
Changelog = "https://github.com/mrcsvg/augsynth-py/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/augsynth_py/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/augsynth_py"]

[tool.hatch.build.targets.sdist]
# Keep the sdist to what a downstream builder/packager needs; notebooks/ is
# exploratory material explicitly not shipped, and papers/ carries only a
# link index (PDFs are untracked local reading copies, see papers/SOURCES.md).
only-include = [
    "src",
    "tests",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CLAUDE.md",
]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "RUF", # ruff-specific
    "NPY", # numpy-specific
    "PD",  # pandas/polars
    "D",   # pydocstyle
]
ignore = [
    "D100",  # missing docstring in public module — ok for internal modules
    "D104",  # missing docstring in public package — ok for __init__.py
    "D105",  # missing docstring in magic method
    "E501",  # line too long — ruff format handles this
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]  # don't require docstrings in tests
# Notebook builders emit markdown strings with LaTeX-adjacent typography (γ, ×, λ,
# −, etc.). These are intentional in the rendered narrative and shouldn't be
# flagged as ambiguous-Unicode. Docstring-style rules also don't apply to
# script-flavoured helpers.
"notebooks/**/*.py" = ["RUF001", "RUF002", "RUF003", "D"]

# ---------------------------------------------------------------------------
# Mypy: strict type checking on src/, lenient on tests/
# ---------------------------------------------------------------------------
# python_version targets 3.12 (not the 3.11 floor) so mypy can parse the PEP 695
# `type` statements in modern numpy's bundled stubs (numpy >= 2.5's __init__.pyi),
# which mypy rejects as a syntax error under a 3.11 target. Our own code stays
# 3.11-compatible: ruff's target-version is py311 and the unit-test matrix runs on
# 3.11, so 3.11-only breakage is still caught outside mypy.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Third-party libs without type stubs.
module = ["cvxpy", "cvxpy.*", "rpy2", "rpy2.*", "joblib", "joblib.*"]
ignore_missing_imports = true
follow_imports = "skip"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: tests that take more than a few seconds",
    "requires_r: tests that need R + augsynth installed (validation_against_r)",
    "requires_r_pkg(*pkgs): test needs the named R package(s); skipped otherwise",
]
filterwarnings = [
    "error",
    # rpy2 emits deprecation warnings we cannot fix
    "ignore::DeprecationWarning:rpy2.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/augsynth_py"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
